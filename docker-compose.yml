services:
    db:
      image: postgres:15
      #enviroment:
        #.env
      environment:
        POSTGRES_USER: postgre_user
        POSTGRES_PASSWORD: postgre_password



    mock_api:
      build:
        #container_name: mock_api
        context: ./mock_api
        dockerfile: dockerfile
      ports: 
        - 8000:8000
      env_file:
        - mock_api/.env
      healthcheck:
        test: ["CMD","curl","-f","http://localhost:8000/health"]
        interval: 10s
        timeout: 5s
        retries: 3
      restart: unless-stopped

