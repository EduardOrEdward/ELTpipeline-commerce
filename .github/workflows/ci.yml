name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-python:
    name: Validate Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            mock_api/requirements.txt
            ingestion/requirements.txt

      - name: Install mock API dependencies
        working-directory: mock_api
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install ingestion dependencies
        run: python -m pip install -r ingestion/requirements.txt

      - name: Compile mock API sources
        working-directory: mock_api
        run: python -m compileall -q .

      - name: Compile ingestion sources
        run: python -m compileall -q ingestion

  docker-build:
    name: Validate Compose and build images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        env:
          S3_ACCESS_KEY: ci-ingestion
          S3_SECRET_KEY: ci-secret
          S3_ADMIN_ACCESS_KEY: ci-admin
          S3_ADMIN_SECRET_KEY: ci-admin-secret
        run: docker compose config

      - name: Build mock API image
        run: docker build --tag elt-pipeline-commerce-mock-api:ci --file mock_api/dockerfile .

      - name: Build ingestion image
        run: docker build --tag elt-pipeline-commerce-ingestion:ci --file ingestion/dockerfile .

      - name: Build dbt image
        run: docker build --tag elt-pipeline-commerce-dbt:ci --file dbt/dockerfile .

  integration:
    name: Integration test
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start integration dependencies
        env:
          FAILURE_RATE: "0"
          S3_ACCESS_KEY: ci-ingestion
          S3_SECRET_KEY: ci-secret
          S3_ADMIN_ACCESS_KEY: ci-admin
          S3_ADMIN_SECRET_KEY: ci-admin-secret
        run: docker compose up -d --wait --wait-timeout 300 db mock_api seaweedfs

      - name: Bootstrap S3 bucket
        env:
          S3_ACCESS_KEY: ci-ingestion
          S3_SECRET_KEY: ci-secret
          S3_ADMIN_ACCESS_KEY: ci-admin
          S3_ADMIN_SECRET_KEY: ci-admin-secret
        run: |
          docker compose run --rm             -e S3_ADMIN_ACCESS_KEY=ci-admin             -e S3_ADMIN_SECRET_KEY=ci-admin-secret             -v "${{ github.workspace }}/tests:/tests:ro"             ingestion python /tests/integration/bootstrap_s3.py

      - name: Run ingestion
        env:
          FAILURE_RATE: "0"
          S3_ACCESS_KEY: ci-ingestion
          S3_SECRET_KEY: ci-secret
          S3_ADMIN_ACCESS_KEY: ci-admin
          S3_ADMIN_SECRET_KEY: ci-admin-secret
        run: docker compose run --rm ingestion

      - name: Verify ingestion boundaries
        env:
          S3_ACCESS_KEY: ci-ingestion
          S3_SECRET_KEY: ci-secret
          S3_ADMIN_ACCESS_KEY: ci-admin
          S3_ADMIN_SECRET_KEY: ci-admin-secret
        run: docker compose run --rm -v "${{ github.workspace }}/tests:/tests:ro" ingestion python /tests/integration/verify_pipeline.py

      - name: Run dbt models and tests
        env:
          POSTGRES_PASSWORD: postgre_password
        run: docker compose run --rm dbt build

      - name: Show service logs on failure
        if: failure()
        env:
          FAILURE_RATE: "0"
          S3_ACCESS_KEY: ci-ingestion
          S3_SECRET_KEY: ci-secret
          S3_ADMIN_ACCESS_KEY: ci-admin
          S3_ADMIN_SECRET_KEY: ci-admin-secret
        run: |
          docker compose ps
          docker inspect seaweedfs --format '{{json .State.Health}}' || true
          docker compose logs

      - name: Stop integration environment
        if: always()
        env:
          S3_ACCESS_KEY: ci-ingestion
          S3_SECRET_KEY: ci-secret
          S3_ADMIN_ACCESS_KEY: ci-admin
          S3_ADMIN_SECRET_KEY: ci-admin-secret
        run: docker compose down -v
