version: 2

models:
  - name: stg_orders
    description: Typed, filtered and deduplicated order records extracted from Bronze.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: product_id
        tests:
          - not_null
      - name: supplier_id
        tests:
          - not_null
      - name: planned_quantity
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null
      - name: expected_delivery_date
        tests:
          - not_null

  - name: stg_deliveries
    description: Typed, filtered and deduplicated delivery records extracted from Bronze.
    columns:
      - name: delivery_id
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: actual_quantity
        tests:
          - not_null
      - name: actual_delivery_date
        tests:
          - not_null

  - name: stg_inventory
    description: Latest typed inventory record per product and business snapshot date.
    columns:
      - name: product_id
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null
