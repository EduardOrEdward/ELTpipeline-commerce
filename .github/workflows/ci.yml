name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-python:
    name: Validate Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            mock_api/requirements.txt
            ingestion/requirements.txt

      - name: Install mock API dependencies
        working-directory: mock_api
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install ingestion dependencies
        run: python -m pip install -r ingestion/requirements.txt

      - name: Compile mock API sources
        working-directory: mock_api
        run: python -m compileall -q .

      - name: Compile ingestion sources
        run: python -m compileall -q ingestion

  docker-build:
    name: Validate Compose and build images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        env:
          S3_ACCESS_KEY: ci-ingestion
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ADMIN_ACCESS_KEY: ci-admin
          S3_ADMIN_SECRET_KEY: ${{ secrets.S3_ADMIN_SECRET_KEY }}
        run: docker compose config

      - name: Build mock API image
        run: docker build --tag elt-pipeline-commerce-mock-api:ci --file mock_api/dockerfile .

      - name: Build ingestion image
        run: docker build --tag elt-pipeline-commerce-ingestion:ci --file ingestion/dockerfile .

  integration:
    name: Integration test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start integration dependencies
        env:
          FAILURE_RATE: "0"
          S3_ACCESS_KEY: ci-ingestion
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: docker compose up -d db mock_api seaweedfs

      - name: Wait for SeaweedFS
        env:
          S3_ACCESS_KEY: ci-ingestion
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          for i in {1..30}; do
            if docker compose run --rm ingestion python -c "import socket; socket.create_connection(('seaweedfs', 8333), timeout=2).close()" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "SeaweedFS did not become reachable"
          exit 1

      - name: Bootstrap S3 bucket
        env:
          S3_ACCESS_KEY: ci-admin
          S3_SECRET_KEY: ${{ secrets.S3_ADMIN_SECRET_KEY }}
          S3_ADMIN_ACCESS_KEY: ci-admin
          S3_ADMIN_SECRET_KEY: ${{ secrets.S3_ADMIN_SECRET_KEY }}
        run: |
          docker compose run --rm ingestion python -c "import os,boto3; from botocore.client import Config; c=boto3.client('s3', endpoint_url='http://seaweedfs:8333', aws_access_key_id=os.environ['S3_ACCESS_KEY'], aws_secret_access_key=os.environ['S3_SECRET_KEY'], region_name='us-east-1', config=Config(signature_version='s3v4')); c.create_bucket(Bucket='elt-raw')"

      - name: Run ingestion
        env:
          FAILURE_RATE: "0"
          S3_ACCESS_KEY: ci-ingestion
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: docker compose run --rm ingestion

      - name: Verify ingestion boundaries
        env:
          S3_ACCESS_KEY: ci-ingestion
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: docker compose run --rm -v "${{ github.workspace }}/tests:/tests:ro" ingestion python /tests/integration/verify_pipeline.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop integration environment
        if: always()
        run: docker compose down -v
